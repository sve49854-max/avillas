<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regístrate | Co-banking AV Villas</title>
    <link rel="icon" href="../assets/official/brand-primary.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div
      class="auth-container inner-page"
      style="background-image: url('../assets/official/BG-CoBanking-red-circle.svg')"
    >
      <div class="slogan"><p>Juntos trabajando</p></div>
      <div class="auth-container_body">
        <div class="auth-container_body-container">
          <div class="auth-container_body-container-nav">
            <div class="auth-container_body-container-logo">
              <a href="../login.html" aria-label="AV Villas">
                <img
                  class="brand-img"
                  src="../assets/official/brand-primary.svg"
                  alt="AV Villas"
                  height="48"
                />
              </a>
            </div>
          </div>
          <div class="auth-container_body-container-header">
            <h6>Crea tu contraseña</h6>
          </div>
          <div class="auth-container_body-container_content">
            <div class="login-container">
              <p class="lead">
                Regístrate para entrar a Co-banking y hacer tus transacciones en
                línea.
              </p>
              <p class="success-note" id="success-note"></p>
              <form id="register-form" class="login-form" novalidate>
                <div class="bavv-form-input">
                  <label for="name">
                    <input id="name" name="name" type="text" placeholder=" " required />
                    <span class="label">Nombre completo</span>
                    <span class="bavv-form-border"></span>
                  </label>
                </div>
                <div class="bavv-form-input dropdown field-select">
                  <label>
                    <input class="select-display" type="text" placeholder=" " readonly autocomplete="off" />
                    <span class="label">Tipo de documento</span>
                    <span class="bavv-form-border"></span>
                    <span class="bavv-form-icon icon-chevron" aria-hidden="true"></span>
                  </label>
                  <ul class="select-menu dropdown-list" role="listbox" hidden>
                    <li role="option" data-value="CC">Cédula de Ciudadanía</li>
                    <li role="option" data-value="CE">Cédula de Extranjería</li>
                    <li role="option" data-value="NIT">NIT</li>
                    <li role="option" data-value="PA">Pasaporte</li>
                  </ul>
                  <input type="hidden" name="docType" id="docType" value="CC" />
                </div>
                <div class="bavv-form-input">
                  <label for="docNumber">
                    <input id="docNumber" name="docNumber" type="text" inputmode="numeric" maxlength="12" placeholder=" " required />
                    <span class="label">Número de documento</span>
                    <span class="bavv-form-border"></span>
                  </label>
                </div>
                <div class="bavv-form-input">
                  <label for="password">
                    <input id="password" name="password" type="password" maxlength="12" placeholder=" " required />
                    <span class="label">Crea tu contraseña</span>
                    <span class="bavv-form-border"></span>
                  </label>
                </div>
                <div class="bavv-form-input pb-0">
                  <label for="confirm">
                    <input id="confirm" name="confirm" type="password" maxlength="12" placeholder=" " required />
                    <span class="label">Confirma tu contraseña</span>
                    <span class="bavv-form-border"></span>
                  </label>
                </div>
                <p class="form-error" id="form-error" hidden></p>
                <div class="login-btn">
                  <button class="btn btn-primary" type="submit">REGISTRARME</button>
                </div>
                <div class="login-issues">
                  <a class="avv-title-semibold" href="../login.html">Volver al ingreso</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../js/registro.js"></script>
  </body>
</html>
