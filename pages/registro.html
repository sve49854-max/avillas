<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regístrate | Co-banking AV Villas</title>
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="page-login">
    <div class="hero-bg" aria-hidden="true">
      <img src="../assets/bg-red.svg" alt="" />
    </div>
    <header class="topbar">
      <p>Juntos trabajando</p>
    </header>
    <main class="inner-page">
      <section class="card login-card">
        <a class="back-link" href="../index.html">← Volver al ingreso</a>
        <a class="brand" href="../index.html" aria-label="AV Villas">
          <svg viewBox="0 0 36 30" aria-hidden="true">
            <path
              fill="#fff"
              d="M2.4 16.2C9.8 13 16.2 6.2 21.4.6c.4 5.2-1.3 9.6-4.2 13.2 6.8.3 13.6 3.7 19.4 8.9-7.5-1.6-13.8.1-18.3 3.6 1.8 3.4 4.1 8.4 5 13.2-4.7-5.9-11.1-10.7-17.7-12.8 3.2-1.8 4.8-4.1-3.2-10.5z"
            />
          </svg>
          <span>AV Villas</span>
        </a>
        <h1>Crea tu contraseña</h1>
        <p class="lead">
          Regístrate para entrar a Co-banking y hacer tus transacciones en
          línea.
        </p>
        <p class="success-note" id="success-note"></p>
        <form id="register-form" class="auth-form" novalidate>
          <label class="field">
            <input type="text" id="name" name="name" placeholder="Nombre completo" required />
          </label>
          <div class="field field-select" data-field="docType">
            <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="select-text">
                <span class="floating">Tipo de documento</span>
                <span class="value">Cédula de Ciudadanía</span>
              </span>
              <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5 7.5 10 12.5 15 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <ul class="select-menu" role="listbox" hidden>
              <li role="option" aria-selected="true" data-value="CC">Cédula de Ciudadanía</li>
              <li role="option" data-value="CE">Cédula de Extranjería</li>
              <li role="option" data-value="NIT">NIT</li>
              <li role="option" data-value="PA">Pasaporte</li>
            </ul>
            <input type="hidden" name="docType" id="docType" value="CC" />
          </div>
          <label class="field">
            <input type="text" id="docNumber" name="docNumber" inputmode="numeric" maxlength="12" placeholder="Número de documento" required />
          </label>
          <label class="field">
            <input type="password" id="password" name="password" maxlength="12" placeholder="Crea tu contraseña" required />
          </label>
          <label class="field">
            <input type="password" id="confirm" name="confirm" maxlength="12" placeholder="Confirma tu contraseña" required />
          </label>
          <p class="form-error" id="form-error" hidden></p>
          <button class="btn-primary" type="submit">REGISTRARME</button>
        </form>
      </section>
    </main>
    <script type="module" src="../js/registro.js"></script>
  </body>
</html>
